<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoHUB - Зв'язок</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            neon: '#0a0a0f',
                        },
                        darkBg: '#12121a',
                        accentNeon: '#ff003c',
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Приховуємо стандартний курсор */
        body {
            cursor: none;
        }

        /* Стилі для кастомного курсора */
        #custom-cursor {
            width: 8px;
            height: 8px;
            background-color: #ff003c;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
        }

        #custom-cursor-outline {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 0, 60, 0.5);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: all 0.15s ease-out;
        }

        /* Картка авто-стилю */
        .auto-card {
            background: linear-gradient(145deg, rgba(18, 18, 26, 0.9), rgba(10, 10, 15, 0.9));
            border: 1px solid rgba(255, 0, 60, 0.2);
            box-shadow: 0 10px 30px -10px rgba(255, 0, 60, 0.3);
        }
    </style>
</head>
<body class="bg-theme-neon text-white font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <!-- Кастомний курсор -->
    <div id="custom-cursor"></div>
    <div id="custom-cursor-outline"></div>

    <!-- Контейнер форми -->
    <main class="w-full max-w-md">
        <div class="auto-card rounded-2xl p-6 md:p-8 shadow-2xl backdrop-blur-md">
            
            <!-- Заголовок -->
            <div class="text-center mb-6">
                <h2 class="text-2xl md:text-3xl font-black uppercase tracking-wider">
                    Зв'язатися з <span class="text-accentNeon">AutoHUB</span>
                </h2>
                <p class="text-xs text-gray-400 mt-1">Оберіть зручний спосіб для зв'язку</p>
            </div>

            <!-- ШВИДКІ КНОПКИ ЗВ'ЯЗКУ -->
            <div class="grid grid-cols-2 gap-3 mb-6">
                <!-- Написати в Telegram -->
                <a href="https://t.me/your_telegram_username" target="_blank" 
                   class="flex items-center justify-center gap-2 bg-[#0088cc]/20 hover:bg-[#0088cc] border border-[#0088cc]/40 text-white font-bold py-3 px-4 rounded-xl text-xs uppercase tracking-wider transition-all duration-200 transform active:scale-95 shadow-lg">
                    <i class="fa-brands fa-telegram text-base text-[#0088cc] group-hover:text-white"></i>
                    <span>Telegram</span>
                </a>

                <!-- Написати на пошту -->
                <a href="mailto:artemmasanov993@gmail.com" 
                   class="flex items-center justify-center gap-2 bg-accentNeon/20 hover:bg-accentNeon border border-accentNeon/40 text-white font-bold py-3 px-4 rounded-xl text-xs uppercase tracking-wider transition-all duration-200 transform active:scale-95 shadow-lg">
                    <i class="fa-solid fa-envelope text-base text-accentNeon group-hover:text-white"></i>
                    <span>Пошта</span>
                </a>
            </div>

            <div class="relative flex py-2 items-center mb-6">
                <div class="flex-grow border-t border-white/10"></div>
                <span class="flex-shrink mx-4 text-xs text-gray-500 uppercase tracking-widest font-bold">або через форму</span>
                <div class="flex-grow border-t border-white/10"></div>
            </div>

            <!-- Форма зворотного зв'язку -->
            <form action="https://formsubmit.co/your_email@gmail.com" method="POST" class="space-y-4">
                
                <!-- Поле Ім'я -->
                <div>
                    <label class="block text-xs font-bold uppercase mb-1 text-gray-400 tracking-wide">Ваше ім'я</label>
                    <input type="text" name="name" required placeholder="Іван" 
                           class="w-full bg-darkBg border border-white/10 rounded-lg py-3 px-4 text-sm text-white focus:border-accentNeon focus:outline-none transition-colors duration-200">
                </div>

                <!-- Поле Повідомлення -->
                <div>
                    <label class="block text-xs font-bold uppercase mb-1 text-gray-400 tracking-wide">Повідомлення</label>
                    <textarea name="message" rows="4" required placeholder="Ваше повідомлення..." 
                              class="w-full bg-darkBg border border-white/10 rounded-lg py-3 px-4 text-sm text-white focus:border-accentNeon focus:outline-none transition-colors duration-200 resize-none"></textarea>
                </div>

                <!-- Кнопка відправки -->
                <button type="submit" 
                        class="w-full bg-accentNeon hover:bg-red-600 text-white font-black py-3.5 px-6 rounded-lg uppercase tracking-widest text-sm transition-all duration-200 transform active:scale-95 shadow-lg shadow-accentNeon/20 flex items-center justify-center gap-2 mt-4">
                    <span>Надіслати форму</span>
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>

            </form>
        </div>
    </main>

    <!-- Скрипт інтерактивного курсора -->
    <script>
        const cursor = document.getElementById('custom-cursor');
        const outline = document.getElementById('custom-cursor-outline');

        document.addEventListener('mousemove', (e) => {
            const posX = e.clientX;
            const posY = e.clientY;

            if (cursor && outline) {
                cursor.style.left = `${posX}px`;
                cursor.style.top = `${posY}px`;

                outline.animate({
                    left: `${posX}px`,
                    top: `${posY}px`
                }, { duration: 150, fill: "forwards" });
            }
        });

        // Ефект збільшення курсора при наведенні
        const interactables = document.querySelectorAll('button, input, textarea, a');
        interactables.forEach(element => {
            element.addEventListener('mouseenter', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1.8)';
                outline.style.transform = 'translate(-50%, -50%) scale(1.5)';
                outline.style.borderColor = '#ff003c';
            });
            element.addEventListener('mouseleave', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
                outline.style.transform = 'translate(-50%, -50%) scale(1)';
            });
        });
    </script>
</body>
</html>
